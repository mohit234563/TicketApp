
spring:
  application:
    name: App
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketapp
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
    show-sql: true
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false      # remove this once you actually run Redis

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: 60